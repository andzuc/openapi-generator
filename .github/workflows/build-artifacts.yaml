name: build-artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenAPI Generator version'
        required: true
        default: 7.11.0-SNAPSHOT
  pull_request:

env:
  IMAGENAME: openapi-generator
  VERSION: ${{ github.event.inputs.version || vars.VERSION }}

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=10485760
      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/andzuc/${{ env.IMAGENAME }}:${{ env.VERSION }}.${{ github.run_number }}
            ghcr.io/andzuc/${{ env.IMAGENAME }}:latest
